name: 配置文件同步至Gist

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync-v2ray:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      gist: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run sync script
      run: python main.py

    - name: Upload Gist ID as artifact
      uses: actions/upload-artifact@v4
      with:
        name: v2rayN-Config
        path: v2rayN-config.txt
        retention-days: 1